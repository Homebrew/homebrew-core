name: Update command-not-found DB

run-name: "Update command-not-found DB for PR #${{ inputs.pull_request }}"

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        type: number
        required: true
      run_id:
        description: ID of the `publish-commit-bottles.yml` run that uploaded the bottle metadata artifact
        type: string
        required: true

defaults:
  run:
    shell: bash -xeuo pipefail {0}

# Updates read, modify and re-push a single GitHub Packages tag, so they run one at a time.
# `queue: max` keeps up to 100 pending runs rather than cancelling all but the newest.
concurrency:
  group: command-not-found-db
  cancel-in-progress: false
  queue: max

env:
  PR: ${{ inputs.pull_request }}
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_FROM_API: 1

permissions: {}

jobs:
  update-command-not-found-db:
    if: github.repository_owner == 'Homebrew'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:main
    permissions:
      actions: read # for actions/download-artifact
      packages: write
      pull-requests: read # for `brew which-update --pull-request`
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          core: true
          cask: false

      - name: Install oras for interacting with GitHub Packages
        uses: Homebrew/actions/cache-homebrew-prefix@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          install: oras
          workflow-key: command-not-found-db-entry
          uninstall: true

      - name: Download bottle metadata artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: command-not-found-bottle-json
          path: bottle-json
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Pull executables.txt from GitHub Packages
        run: oras pull ghcr.io/homebrew/command-not-found/executables:latest

      # The pull request may already be merged and its branch deleted by the time this runs.
      # `brew which-update` only needs the bottle metadata and the pull request's file list.
      - name: Update database
        id: update-db
        working-directory: ${{steps.set-up-homebrew.outputs.repository-path}}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          brew which-update \
            --pull-request="$PR" \
            --repository="$GITHUB_REPOSITORY" \
            --bottle-json-dir="$GITHUB_WORKSPACE/bottle-json" \
            --summary-file="$GITHUB_STEP_SUMMARY" \
            "$GITHUB_WORKSPACE/executables.txt"

      - name: Log in to GitHub Packages
        if: fromJson(steps.update-db.outputs.updated)
        run: echo "${{secrets.HOMEBREW_CORE_GITHUB_PACKAGES_TOKEN}}" | oras login ghcr.io --username brewtestbot --password-stdin

      - name: Push to GitHub Packages
        if: fromJson(steps.update-db.outputs.updated)
        run: |
          oras push --artifact-type application/vnd.homebrew.command-not-found.executables \
            ghcr.io/homebrew/command-not-found/executables:latest \
            executables.txt:text/plain

      - name: Check upload
        if: fromJson(steps.update-db.outputs.updated)
        run: |
          shasum --algorithm=256 executables.txt > executables.txt.sha256
          rm -f executables.txt
          oras pull ghcr.io/homebrew/command-not-found/executables:latest
          shasum --algorithm=256 --check executables.txt.sha256
