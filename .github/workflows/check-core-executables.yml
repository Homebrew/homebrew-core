name: Check executables package write access

on:
  push:
    branches: [publish-core-executables]

permissions:
  packages: write

jobs:
  verify:
    if: github.repository == 'Homebrew/homebrew-core'
    runs-on: ubuntu-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1

      - run: brew install oras

      - name: Write an untagged blob to the new package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head -c 32 /dev/urandom > "$RUNNER_TEMP/probe"
          oras blob push --username "$GITHUB_ACTOR" --password-stdin \
            ghcr.io/homebrew/core/command-not-found/executables "$RUNNER_TEMP/probe" <<< "$GH_TOKEN"
